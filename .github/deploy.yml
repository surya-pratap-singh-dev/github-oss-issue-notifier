name: Deploy to AWS VM

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Syntax check
        run: python3 -m py_compile app.py

      - name: Deploy app
        run: |
          DEPLOY_DIR="$HOME/github-oss-issue-notifier"
          mkdir -p "$DEPLOY_DIR"

          cp app.py requirements.txt Dockerfile docker-compose.yml README.md .env.example "$DEPLOY_DIR"/

          cd "$DEPLOY_DIR"
          test -f .env

          sudo docker compose up -d --build
          sudo docker compose ps
