name: Deploy to AWS VM

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Syntax check
        run: python3 -m py_compile app.py

      - name: Check .env exists
        run: |
          if [ ! -f "$HOME/github-oss-issue-notifier/.env" ]; then
            echo "ERROR: .env file missing on VM. SSH in and create it."
            exit 1
          fi

      - name: Copy .env into workspace
        run: cp "$HOME/github-oss-issue-notifier/.env" .env

      - name: Deploy app
        run: |
          sudo docker compose up -d --build
          sudo docker compose ps